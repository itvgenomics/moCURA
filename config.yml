pipeline:
  threads: 20
  only_circularized: true

figures:
  format: png
  dpi: 300
  style:
    annotate: true
    bar_linewidth: 10
    x_tick_pad: 7.5
    x_label_pad: 15
    plot_height_scale: 1.5
    panel_title_fontsize: 24
    panel_letter_fontsize: 17
    legend_fontsize: 13
    legend_title_fontsize: 15
    colorbar_label_fontsize: 11
    colorbar_tick_fontsize: 10
    project_label_fontsize: 9
    axis_label_fontsize: 11

plots:
  novoplasty_summary:
    enabled: false
    point_size: 15
    title_fontsize: 18
    panel_letter_fontsize: 15
    legend_fontsize: 12
    legend_title_fontsize: 14
    range_line: '#B0E4CC'
    row_background: '#EEEEEE'
  genome_size_heatmap:
    enabled: false
    cmap: viridis
    mismatch_alpha: 0.25
    title_fontsize: 20
    panel_letter_fontsize: 15
  pilon_heatmap:
    enabled: false
    mismatch_alpha: 0.25
    metrics_per_row: 2
    gene_rows_per_metric: 2
    category_column_spacing: 0.08
    category_row_spacing: 0.16
    gene_row_spacing: 0.18
    gene_block_spacing: 0.025
    category_title_height: 0.13
    colorbar_width: 0.025
  pilon_before_after_heatmap:
    enabled: false
    mismatch_alpha: 0.25
    metrics_per_row: 2
    gene_rows_per_metric: 2
    category_column_spacing: 0.08
    category_row_spacing: 0.16
    gene_row_spacing: 0.18
    gene_block_spacing: 0.025
    category_title_height: 0.13
    colorbar_width: 0.025
    stage_bar_offset: 0.03
  marker_length_heatmaps:
    enabled: false
    annotate: true
    cmap: cividis
    mismatch_alpha: 0.35
    annotation_size: 7
    title_fontsize: 20
    legend_fontsize: 20
    legend_title_fontsize: 13
    x_tick_size: 10
    y_tick_size: 10
    bar_linewidth: 10
    maximum_figure_width: 26
    maximum_figure_height: 24

genbank:
  enabled: true
  folder_name: genbanks
  suffix: .rotated.gb
  feature_types:
  - CDS
  - rRNA
  - tRNA
  - D-loop
  - misc_feature
  - regulatory
  include_unknown_markers: false

marker_snp_analysis:
  enabled: true
  only_when_circularized: true
  overwrite: false
  minimum_sequences: 2
  minimum_projects: 2
  extraction:
    concurrency: 8
    feature_types:
    - CDS
    - rRNA
    - tRNA
    - misc_feature
    - regulatory
    infer_control_region: true
    representative_strategy: matching_seed_then_modal
    preferred_seed_inputs: []
    sequence_id_order: project_then_kmer
  mafft:
    binary: mafft
    mode: fftns2
    concurrency: 4
    threads_per_job: 4
    extra_args: []
  snp_matrix:
    enabled: true
    output_folder: snp_matrices
    concurrency: 4
    format: png
    dpi: 300
    only_true_snps: true
    label_template: '{project_label} | K-mer {kmer}'
    project_labels: {}
    project_order: []
    project_sort_ascending: true
    kmer_sort_ascending: true
    reference_project: ITV38290
    reference_kmer: 20
    reference_sequence_id: null
    columns_per_panel: 60
    title_fontsize: 18
    panel_title_fontsize: 11
    legend_fontsize: 10
    annotation_fontsize: 8
    x_tick_fontsize: 8
    y_tick_fontsize: 9
    row_height: 0.42
    cell_width: 0.62
    minimum_panel_width: 8
    maximum_figure_width: 32
    alternate_project_border: true
    first_project_has_border: true
    project_border_color: '#111111'
    project_border_linewidth: 2.0
    separator_color: '#d0d0d0'
    separator_linewidth: 0.7
    base_colors:
      A: '#4daf4a'
      C: '#377eb8'
      G: '#ff7f00'
      T: '#e41a1c'
      '-': '#bdbdbd'
      N: '#f0f0f0'
    save_table: true
    top: 0.91
    bottom: 0.04
    left: 0.22
    right: 0.98
    hspace: 0.3
    save_image: false

trf:
  enabled: true
  output_folder: trf_analysis
  binary: trf
  overwrite: false
  concurrency: 12
  timeout: 3600
  match: 2
  mismatch: 7
  delta: 7
  match_probability: 80
  indel_probability: 10
  min_score: 50
  max_period: 500
  suppress_html: true
  flanking: false
  masked: false
  no_redundancy: false
  max_tr_length_millions: null

# Phase 1: analyses of the files OrganPipe already produces.
# Each section can be switched off with enabled: false. A missing input file
# logs a warning and leaves the values empty; the run continues.
organpipe:
  # Root of the OrganPipe run (holds results/, workflow/reports/ and benchmarks/).
  # When null, moCURA uses the parent of --results-dir if those folders are siblings.
  organpipe_dir: null

mitos2_completeness:
  enabled: true
  output_folder: mitos2_completeness

coverage_profile:
  enabled: true
  window_size: 50
  low_depth_threshold: 10
  low_coverage_alert_percent: 5
  output_folder: coverage_profile

pilon_changes:
  enabled: true
  output_folder: pilon_changes

read_recruitment:
  enabled: true
  identity_threshold: 98
  output_folder: read_recruitment

nhmmer_alerts:
  enabled: true
  max_evalue: 0.001
  output_folder: nhmmer_alerts

read_qc:
  enabled: true
  output_folder: read_qc

provenance:
  enabled: true
  output_folder: provenance

assembly_alerts:
  enabled: true
  output_folder: assembly_alerts

# Phase 2. The junction is checked on the rotated BAM of OrganPipe, which maps the
# Assembled_reads of the same assembly; bam_template accepts another BAM, e.g.
# "{results_dir}/{project}/rawreads_mapping/{assembly}.rotated.bam".
junction_validation:
  enabled: true
  output_folder: junction_validation
  min_flank: 20
  min_mapping_quality: 20
  supported_min_spanning_reads: 10
  weak_min_spanning_reads: 3
  weak_min_flanking_pairs: 3
  max_insert_size: 1000
  bam_template: null

# genetic_code: null reads genetic_code from the OrganPipe config/config.yaml,
# falling back to 2 (vertebrate mitochondrial).
annotation_integrity:
  enabled: true
  output_folder: annotation_integrity
  genetic_code: null
  length_deviation_percent: 10

# MAFFT settings default to marker_snp_analysis.mafft; override them under mafft:.
assembly_concordance:
  enabled: true
  output_folder: assembly_concordance
  group_identity_threshold: 99.5
  group_min_coverage: 95
  max_sequences: 150
  overwrite: false
  mafft: {}

sequence_composition:
  enabled: true
  output_folder: sequence_composition

assembly_score:
  enabled: true
  output_folder: assembly_score
  length_tolerance_percent: 5
  # NA components (no BAM, no rotated genome) count as this value; null leaves them out.
  na_value: 0.5
  weights:
    completeness: 3
    integrity: 2
    junction: 2
    coverage: 1
    pilon: 1
    concordance: 2
    length: 1

# Phase 3. Heteroplasmy candidates from the rotated BAM (pileup). Frequencies are
# a lower bound: the OrganPipe BAM holds the reads NOVOPlasty assembled.
heteroplasmy:
  enabled: true
  output_folder: heteroplasmy
  min_depth: 20
  min_minor_reads: 3
  min_frequency: 0.10
  min_mapping_quality: 20
  # Ignored when the BAM stores no base qualities (OrganPipe BAMs often do not).
  min_base_quality: 20
  # Sites near the contig ends, in clusters, on one strand only or inside a TRF
  # repeat are kept as low confidence and left out of the counts and alerts.
  edge_exclusion: 50
  cluster_window: 20
  max_cluster_sites: 2
  require_both_strands: true
  bam_template: null

# NCBI and BOLD access shared by species_identification and reference_comparison.
# env_file (or --env-file) holds NCBI_API_KEY=... and optionally NCBI_EMAIL=...;
# with a key, 10 requests per second, without it 3. BLAST also follows NCBI's
# rule of 10 s between submissions and one status check per minute per search.
# Answers are cached in cache_dir (default: <output>/species_identification/cache).
remote_services:
  env_file: null
  cache_dir: null
  refresh: false
  timeout: 120
  retries: 3
  blast_submit_interval: 10
  blast_poll_interval: 60
  blast_max_wait: 1800

# COI (mitochondrion) or rbcL and matK (chloroplast) of the recommended assembly
# against BOLD and GenBank. With --metadata the declared species is confirmed;
# without it the top_species most similar species of each database are listed.
species_identification:
  enabled: true
  output_folder: species_identification
  # null: read organelle from the OrganPipe config, falling back to mitochondrion.
  organelle: null
  # null: COI for mitochondrion, rbcL and matK for chloroplast.
  markers: null
  # null: public.tax-derep (animals) or public.plants (chloroplast).
  bold_database: null
  bold_min_identity: 0.9
  bold_max_hits: 100
  blast_database: core_nt
  blast_hitlist_size: 250
  min_overlap: 400
  top_species: 3
  identity_threshold: 97
  tie_margin: 0.5

# RefSeq complete genomes of the same organelle in the genus of the sample, or in
# the family when the genus has fewer than min_references (add order to levels to
# go further). Genome length, gene lengths and tandem repeats are compared.
reference_comparison:
  enabled: true
  output_folder: reference_comparison
  levels: [genus, family]
  min_references: 1
  max_references: 50
  length_tolerance_percent: 5
  gene_tolerance_percent: 10
  compare_repeats: true

# GenBank submission check with table2asn (bioconda). Writes .fsa, .tbl, .sqn,
# .val, .dr and .gbf per assembly. assemblies: recommended or all. template: an
# optional .sbt file; without it the missing-publication messages are ignored.
ncbi_validation:
  enabled: true
  output_folder: ncbi_validation
  binary: table2asn
  assemblies: recommended
  template: null
  timeout: 600
  ignore_codes:
    - SEQ_DESCR.NoTaxonID

html_report:
  enabled: true
  output_file: moCURA_report.html
  title: moCURA interactive report
  max_repeat_families: 18
  chart_library: d3_cdn
  snp_renderer: d3
  snp_columns_per_panel: 60
  snp_project_gap: 12
  snp_compact_max_columns: 14
  snp_min_length_ratio: 0.9
  logo_path: assets/mocura_logo.svg
  logo_alt: moCURA logo
  metadata_path: null
  pilon_stack_threshold: 10
  pilon_height_per_group: 22
  pilon_max_height: 900
  maptiler_style_url: https://api.maptiler.com/maps/outdoor-v4/style.json
  maptiler_api_key: 8wnOsKBVxR6W3DrA6WyD
  map_single_point_zoom: 16
  map_fit_max_zoom: 17
  map_max_zoom: 20
